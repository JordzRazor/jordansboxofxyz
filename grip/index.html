<!DOCTYPE html>
<html>
<head>
<script data-canonical-host>(function(){var h=location.hostname;if(h!=="jordansboxof.xyz"&&/\.azurestaticapps\.net$/i.test(h)){location.replace("https://jordansboxof.xyz"+location.pathname+location.search+location.hash);}})();</script>
<title>Grip — jordansboxofxyz</title>

<meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  #hud { position: fixed; top: 8px; left: 8px; color: #0f0;
         font: 12px monospace; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const BUDGET = 1000 / 60;                    // v-sync frame budget (ms)

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 3, 8);
scene.add(sun);

// ---- zero-g camera state --------------------------------------------
const camVel = new THREE.Vector3(0, 0, -0.03);   // initial shove, drift forever
const angVel = new THREE.Vector2(0, 0);

const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup',   e => keys[e.code] = false);

// ---- entities: heavy meshes that can melt frames ---------------------
const entities = [];
for (let i = 0; i < 12; i++) {
  const geo = new THREE.TorusKnotGeometry(1, 0.3, 220, 32);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(i / 12, 0.8, 0.55),
    roughness: 0.4, metalness: 0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set((Math.random()-0.5)*24, (Math.random()-0.5)*24, (Math.random()-0.5)*24);
  mesh.userData = {
    gripped: false,
    baseColor: mat.color.clone(),
    base: geo.attributes.position.array.slice(),
    spin: new THREE.Vector3(Math.random(), Math.random(), Math.random())
  };
  scene.add(mesh);
  entities.push(mesh);
}

function work(mesh, t) {                       // the melting: per-vertex trig
  const u = mesh.userData, p = mesh.geometry.attributes.position.array, b = u.base;
  for (let i = 0; i < p.length; i += 3) {
    const w = Math.sin(b[i] * 3 + t * 0.002) * Math.cos(b[i+1] * 3 - t * 0.0015);
    p[i]     = b[i]     + w * 0.25;
    p[i + 1] = b[i + 1] + Math.sin(b[i+2] * 3 + t * 0.0018) * 0.25;
    p[i + 2] = b[i + 2] + w * 0.25;
  }
  mesh.geometry.attributes.position.needsUpdate = true;
  mesh.rotation.x += u.spin.x * 0.004;
  mesh.rotation.y += u.spin.y * 0.004;
}

function gripOne() {                           // grab a melter: freeze + gray out
  const e = entities.find(e => !e.gripped);
  if (!e) return;
  e.gripped = true;
  e.material.color.set(0x333333);
}
function ungripOne() {                         // calm down -> let one go
  const e = entities.find(e => e.gripped);
  if (!e) return;
  e.gripped = false;
  e.material.color.copy(e.userData.baseColor);
}

// ---- main loop --------------------------------------------------------
const hud = document.getElementById('hud');
let last = performance.now(), ema = BUDGET, frames = 0;

function frame(now) {
  requestAnimationFrame(frame);                // rAF is v-sync locked
  const dt = now - last; last = now;
  ema = ema * 0.9 + dt * 0.1;

  // grip / ungrip based on frame-time
  if (ema > BUDGET * 0.95) gripOne();
  else if (ema < BUDGET * 0.70) ungripOne();

  // zero-g controls: WASD thrust, QE up/down, arrows turn
  const thrust = new THREE.Vector3(
    (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0),
    (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0),
    (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0));
  if (thrust.lengthSq() > 0)
    camVel.addScaledVector(thrust.normalize().applyQuaternion(camera.quaternion), 0.002);
  angVel.y += ((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0)) * 0.0004;
  angVel.x += ((keys.ArrowUp    ? 1 : 0) - (keys.ArrowDown  ? 1 : 0)) * 0.0004;

  camera.rotation.y += angVel.y;
  camera.rotation.x += angVel.x;
  camera.position.addScaledVector(camVel, dt / BUDGET);   // drift forever

  for (const e of entities) if (!e.gripped) work(e, now); // gripped ones sit still

  renderer.render(scene, camera);

  if (++frames % 10 === 0)
    hud.textContent = `frame ${ema.toFixed(2)}ms (budget ${BUDGET.toFixed(2)}ms)\n` +
                      `gripped: ${entities.filter(e => e.gripped).length}/${entities.length}\n` +
                      `WASD thrust / QE vertical / arrows turn`;
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

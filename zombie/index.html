<meta charset="utf-8" />

<title>ZOMBIE.FPS // three.js</title>
<style>
  :root{
    --acid:#9dff4a;
    --blood:#ff3b3b;
    --panel:#0b0e12;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05070a;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:#cfe3d4;-webkit-font-smoothing:antialiased}
  canvas{display:block}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;
       opacity:0;transition:opacity .25s}
  #hud.on{opacity:1}

  /* crosshair */
  #cross{position:absolute;left:50%;top:50%;width:26px;height:26px;
         transform:translate(-50%,-50%)}
  #cross i{position:absolute;background:var(--acid);opacity:.85;
           box-shadow:0 0 6px rgba(157,255,74,.6)}
  #cross i.t{left:50%;top:0;width:2px;height:8px;margin-left:-1px}
  #cross i.b{left:50%;bottom:0;width:2px;height:8px;margin-left:-1px}
  #cross i.l{top:50%;left:0;height:2px;width:8px;margin-top:-1px}
  #cross i.r{top:50%;right:0;height:2px;width:8px;margin-top:-1px}
  #cross i.dot{left:50%;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;
               opacity:.5}
  #hitmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:22px;color:#fff;opacity:0;font-weight:700;
    text-shadow:0 0 8px #ff4d4d}

  /* top-left stats */
  #stats{position:absolute;top:18px;left:20px;font-size:12px;
         letter-spacing:.14em;line-height:1.9}
  #stats .row{display:flex;gap:10px;align-items:baseline}
  #stats .k{color:#4d6b58;width:58px}
  #stats .v{color:var(--acid);font-weight:700;
            text-shadow:0 0 10px rgba(157,255,74,.35)}
  #stats .v.dim{color:#7fa08a;text-shadow:none}

  #skillHint{
    position:absolute;top:174px;left:20px;font-size:11px;letter-spacing:.22em;
    color:#ffb347;text-shadow:0 0 12px rgba(255,179,71,.5);
    opacity:0;transition:opacity .2s;pointer-events:none;
  }
  #skillHint.on{opacity:1;animation:spPulse 1.6s ease-in-out infinite}
  #skillHint b{color:var(--acid);border:1px solid var(--acid);
    padding:1px 5px;margin-left:2px;font-weight:700}
  @keyframes spPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}

  /* bottom-left bars */
  #bars{position:absolute;bottom:22px;left:20px;width:280px}
  .barrow{display:flex;align-items:center;gap:10px;margin-top:9px;
          font-size:11px;letter-spacing:.14em}
  .barrow .lbl{width:26px;color:#4d6b58}
  .barrow .track{flex:1;height:9px;background:#121a15;
    border:1px solid #24352a;position:relative;overflow:hidden}
  .barrow .fill{position:absolute;inset:0;width:100%;transform-origin:left;
    transition:transform .12s linear}
  #hpFill{background:linear-gradient(90deg,#ff3b3b,#ff8a5c)}
  #xpFill{background:linear-gradient(90deg,#5cff9d,#9dff4a)}
  .barrow .num{width:56px;text-align:right;color:#9dff4a;font-weight:700}
  .barrow .num.hp{color:#ff8a8a}

  /* bottom-right ammo */
  #ammo{position:absolute;bottom:22px;right:24px;text-align:right;
        font-size:13px;letter-spacing:.14em}
  #ammo .mag{font-size:40px;font-weight:800;color:var(--acid);line-height:1;
             text-shadow:0 0 18px rgba(157,255,74,.35)}
  #ammo .res{font-size:15px;color:#4d6b58;margin-left:6px}
  #reloadTxt{margin-top:6px;font-size:11px;color:#ffb347;letter-spacing:.2em;
             opacity:0;transition:opacity .1s}
  #reloadTxt.on{opacity:1}

  /* toast */
  #toast{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);
    font-size:30px;font-weight:800;letter-spacing:.3em;color:var(--acid);
    text-shadow:0 0 24px rgba(157,255,74,.7);opacity:0;
    transition:opacity .18s}
  #toast.on{opacity:1}

  /* damage vignette */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:11;opacity:0;
    background:radial-gradient(ellipse at center,
      rgba(255,0,0,0) 35%, rgba(180,0,0,.75) 100%);
    transition:opacity .12s}
  #lowhp{position:fixed;inset:0;pointer-events:none;z-index:11;opacity:0;
    background:radial-gradient(ellipse at center,
      rgba(255,0,0,0) 45%, rgba(140,0,0,.55) 100%);
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.5)}}

  /* ---------- OVERLAY ---------- */
  #overlay{position:fixed;inset:0;z-index:30;display:flex;
    align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#0d1218 0%,#04060a 75%);
    transition:opacity .3s}
  #overlay.hide{opacity:0;pointer-events:none}
  .panel{text-align:center;padding:44px 56px;
    border:1px solid #1d2b22;background:rgba(8,12,10,.82);
    box-shadow:0 0 80px rgba(0,0,0,.9), inset 0 0 60px rgba(157,255,74,.03);
    max-width:640px}
  .panel h1{font-size:52px;letter-spacing:.16em;font-weight:800;
    color:var(--acid);text-shadow:0 0 30px rgba(157,255,74,.35);
    line-height:1}
  .panel h1 span{color:#3d5647;text-shadow:none}
  .panel .sub{margin-top:10px;font-size:11px;letter-spacing:.32em;
    color:#4d6b58}
  .panel .keys{margin:28px 0 30px;font-size:12px;line-height:2.1;
    color:#87a894;letter-spacing:.08em}
  .panel .keys b{color:var(--acid);font-weight:700}
  .panel button{
    pointer-events:auto;cursor:pointer;font-family:inherit;
    background:transparent;border:1px solid var(--acid);color:var(--acid);
    padding:14px 42px;font-size:13px;letter-spacing:.28em;font-weight:700;
    transition:.18s}
  .panel button:hover{background:var(--acid);color:#060a07;
    box-shadow:0 0 34px rgba(157,255,74,.5)}
  .panel .dead{color:var(--blood);text-shadow:0 0 30px rgba(255,59,59,.4)}
  .panel .tally{margin:20px 0 26px;font-size:13px;color:#87a894;
    letter-spacing:.16em;line-height:2.2}
  .panel .tally b{color:var(--acid)}
  .hint{margin-top:16px;font-size:10px;color:#31453a;letter-spacing:.2em}

/* ---------- security check widget ---------- */
#secWrap{display:flex;justify-content:center;margin:22px 0 6px}
#secCheck{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:184px;height:184px;border-radius:50%;cursor:pointer;
  border:1px solid #24352a;
  background:radial-gradient(circle at 50% 42%, #0e1712, #060a08);
  transition:border-color .15s, box-shadow .15s;user-select:none;
}
#secCheck:hover{border-color:#3d6b4a;box-shadow:0 0 30px rgba(157,255,74,.08)}
#secCheck .ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid var(--acid);opacity:0;transform:scale(.92);
  pointer-events:none;
}
#secCheck .ring.go{animation:ringPulse .55s ease-out}
@keyframes ringPulse{
  0%{opacity:.9;transform:scale(.92)}
  100%{opacity:0;transform:scale(1.1)}
}
#secCheck .core{text-align:center;pointer-events:none}
#secCheck .core .big{
  font-size:26px;font-weight:800;color:var(--acid);letter-spacing:.12em;
  line-height:1;text-shadow:0 0 14px rgba(157,255,74,.4);
}
#secCheck .core .sm{
  margin-top:9px;font-size:9px;letter-spacing:.3em;color:#4d6b58;
}
#secCheck .dots{display:flex;gap:9px;justify-content:center;margin-top:13px}
#secCheck .dots i{
  width:7px;height:7px;border-radius:50%;background:#1e2c23;
  transition:background .12s, box-shadow .12s;
}
#secCheck .dots i.on{background:var(--acid);box-shadow:0 0 10px rgba(157,255,74,.75)}
#secCheck.granted{
  border-color:var(--acid);box-shadow:0 0 44px rgba(157,255,74,.45);
}
#secCheck.granted .core .big{color:#fff}
#secCheck.shake{animation:shakeX .32s}
@keyframes shakeX{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  60%{transform:translateX(7px)}
  80%{transform:translateX(-3px)}
}

.sVal{width:54px;text-align:right;color:var(--acid);font-weight:700;flex-shrink:0}

.sBadge{font-size:8px;letter-spacing:.2em;color:#ffb347;

.sFoot{padding:12px 22px;border-top:1px solid #16241b;

  #skillPanel{position:fixed;inset:0;z-index:55;display:none;

  #skillPanel.on{display:flex}
  .spBox{width:min(520px,92vw);background:rgba(8,12,10,.98);

  .spHead{display:flex;justify-content:space-between;align-items:center;

<script type="module">
import * as THREE from 'three';

/* =========================================================================
   CONFIG — every tuning knob lives here
   ========================================================================= */
const CFG = {
  player: {
    eyeHeight: 1.70,
    radius: 0.40,
    speed: 6.0,
    sprintMul: 1.60,
    jumpVel: 6.5,
    gravity: 22,
    baseHealth: 100,
    baseDamage: 35,        // per bullet, at level 1
    baseFireDelay: 0.12,   // seconds between shots, before caps
    fireDelayCap:  0.035,  // hard ceiling on fire rate (~28/s)
    magSize: 30,           // base magazine
    magSizePerLevel: 2,    // +N rounds per player level
    reloadTime: 1.5,
    killsPerLevel: 5,
    scale: 1.18,           // <-- levelling scalar (player)
    headshotMul: 2.6,
    headshotKillBonusXp: 1,
    skillPointsPerLevel: 3,
  },
  zombie: {
    baseHealth: 55,
    baseSpeed: 1.70,
    speedJitter: 0.30,
    damage: 12,            // STATIC damage per hit
    attackCooldown: 0.90,
    attackRange: 1.75,
    radius: 0.45,
    scale: 1.25,           // <-- levelling scalar (zombies)
    scaleDamage: false,    // flip true if you want damage to scale too
    reachPerLevel: 0.08,   // +0.08 melee reach per gamestage above 1
  },
  wave: {
    baseCount: 5,
    growth: 2,
    spawnInterval: 0.65,
    breather: 3.0,
  },
  arena: 45,
  gamestage: {
    lo: -3,        // minimum offset from player level
    hi: +5,        // maximum offset from player level
    bias: 0.55,    // exponent on random; <1 skews toward hi
  },
};

/* =========================================================================
   ATTRIBUTES — spend skill points here
   ========================================================================= */
const ATTRIBUTES = {
  vitality: { label: 'VITALITY', icon: '♥', desc: '+14 max HP per point' },
  might:    { label: 'MIGHT',    icon: '⚔', desc: '+8% bullet damage per point — expensive' },
  reflex:   { label: 'REFLEX',   icon: '⚡', desc: '+6% fire rate (capped) · +5% reload · +1 mag' },
  agility:  { label: 'AGILITY',  icon: '➤', desc: '+4% move speed per point' },
  fortune:  { label: 'FORTUNE',  icon: '✦', desc: '+10% XP from kills per point' },
};

/* Cost curve: cost of the *next* point = 1 + floor(level / divisor).
   Lower divisor → steeper climb. Might is the DPS stat, so it's the worst. */
const ATTR_COST_DIV = {
  vitality: 6,
  might:    3,
  reflex:   5,
  agility:  5,
  fortune:  6,
};

function attributeCost(key) {
  const lv  = player.attributes[key] | 0;
  const div = ATTR_COST_DIV[key] || 5;
  return 1 + Math.floor(lv / div);
}

/* =========================================================================
   MOB TYPES — unlocked by gamestage
   ========================================================================= */
const MOB_TYPES = {
  walker: {
    label: 'WALKER', minLevel: 1,
    weight: lv => Math.max(1.0, 10 - lv * 0.35),
    color: 0x8aa878, scale: 1.00,
    healthMul: 1.00, speedMul: 1.00, damageMul: 1.00, reachMul: 1.00, cooldownMul: 1.00,
    ranged: false,
  },
  runner: {
    label: 'RUNNER', minLevel: 2,
    weight: lv => lv >= 2 ? 2.5 + lv * 0.55 : 0,
    color: 0xb8c078, scale: 0.85,
    healthMul: 0.60, speedMul: 1.90, damageMul: 0.80, reachMul: 1.00, cooldownMul: 0.75,
    ranged: false,
  },
  brute: {
    label: 'BRUTE', minLevel: 4,
    weight: lv => lv >= 4 ? 1.0 + lv * 0.45 : 0,
    color: 0xa8705a, scale: 1.38,
    healthMul: 2.80, speedMul: 0.72, damageMul: 1.60, reachMul: 1.55, cooldownMul: 1.25,
    ranged: false,
  },
  spitter: {
    label: 'SPITTER', minLevel: 5,
    weight: lv => lv >= 5 ? 1.2 + lv * 0.35 : 0,
    color: 0x9a7ac8, scale: 0.95,
    healthMul: 0.85, speedMul: 0.80, damageMul: 0.55, reachMul: 0.00, cooldownMul: 1.00,
    ranged: true, preferredRange: 11.0, fireInterval: 2.4, projectileSpeed: 14,
  },
};

/* ---- derived stats (the levelling math) -------------------------------- */
function playerStats(level, attrs) {
  const e = level - 1;
  const a = attrs || { vitality: 0, might: 0, reflex: 0, agility: 0, fortune: 0 };
  const scale = Math.pow(CFG.player.scale, e);

  // fire rate: bounded. Level and reflex both try to push the delay down;
  // after both multipliers, clamp at the weapon's physical cycle floor.
  const rawFireDelay =
    CFG.player.baseFireDelay / Math.pow(1.06, e) / (1 + 0.06 * a.reflex);
  const fireDelay = Math.max(CFG.player.fireDelayCap, rawFireDelay);

  // reload time: deliberately uncapped
  const reloadTime = CFG.player.reloadTime / (1 + 0.05 * a.reflex);

  // magazine: linear in level and reflex, no cap
  const magSize = Math.floor(
    CFG.player.magSize +
    CFG.player.magSizePerLevel * e +
    a.reflex
  );

  return {
    maxHealth:  (CFG.player.baseHealth + a.vitality * 14) * scale,
    damage:     (CFG.player.baseDamage * (1 + 0.08 * a.might))
                  * Math.pow(CFG.player.scale, e * 0.8),
    fireDelay,
    reloadTime,
    magSize,
    moveSpeed:  CFG.player.speed * (1 + 0.04 * a.agility),
    xpMul:      1 + 0.10 * a.fortune,
  };
}
function zombieStats(level, typeKey) {
  const t = MOB_TYPES[typeKey] || MOB_TYPES.walker;
  const e = level - 1;
  return {
    maxHealth: CFG.zombie.baseHealth * Math.pow(CFG.zombie.scale, e) * t.healthMul,
    speed:     CFG.zombie.baseSpeed * (1 + 0.045 * e) * t.speedMul,
    damage:    (CFG.zombie.scaleDamage
                  ? CFG.zombie.damage * Math.pow(CFG.zombie.scale, e)
                  : CFG.zombie.damage) * t.damageMul,
    reach:     (CFG.zombie.attackRange + CFG.zombie.reachPerLevel * e) * t.reachMul,
    cooldown:  CFG.zombie.attackCooldown * t.cooldownMul,
  };
}

/* =========================================================================
   GAMESTAGE — the world's level, rolled fresh per spawn
   ========================================================================= */
function rollGamestage(playerLevel) {
  const lo = CFG.gamestage.lo, hi = CFG.gamestage.hi;
  const span = hi - lo;
  const r = Math.pow(Math.random(), CFG.gamestage.bias); // bias toward hi
  return Math.max(1, playerLevel + lo + Math.round(r * span));
}

/* =========================================================================
   MOB SELECTION — weighted by gamestage
   ========================================================================= */
function pickMobType(level) {
  const keys = Object.keys(MOB_TYPES);
  let total = 0;
  const w = keys.map(k => {
    const t = MOB_TYPES[k];
    if (level < t.minLevel) return 0;
    const v = t.weight(level);
    total += v;
    return v;
  });
  if (total <= 0) return 'walker';
  let r = Math.random() * total;
  for (let i = 0; i < keys.length; i++) {
    if (r < w[i]) return keys[i];
    r -= w[i];
  }
  return 'walker';
}

/* =========================================================================
   COLLISION (XZ AABB pushout)
   ========================================================================= */
function resolveCollisions(pos, radius) {
  for (const b of colliders) {
    const minX = b.min.x - radius, maxX = b.max.x + radius;
    const minZ = b.min.z - radius, maxZ = b.max.z + radius;
    if (pos.x > minX && pos.x < maxX && pos.z > minZ && pos.z < maxZ) {
      const pl = pos.x - minX, pr = maxX - pos.x;
      const pt = pos.z - minZ, pb = maxZ - pos.z;
      const m = Math.min(pl, pr, pt, pb);
      if (m === pl) pos.x = minX;
      else if (m === pr) pos.x = maxX;
      else if (m === pt) pos.z = minZ;
      else pos.z = maxZ;
    }
  }
  const lim = A - 1;
  pos.x = Math.max(-lim, Math.min(lim, pos.x));
  pos.z = Math.max(-lim, Math.min(lim, pos.z));
}
function insideCollider(x, z, pad = 0) {
  for (const b of colliders) {
    if (x > b.min.x - pad && x < b.max.x + pad &&
        z > b.min.z - pad && z < b.max.z + pad) return true;
  }
  return false;
}

/* =========================================================================
   AUDIO — tiny WebAudio synth, no assets
   ========================================================================= */
let actx = null, master = null, noiseBuf = null;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0.5;
  master.connect(actx.destination);

  const len = actx.sampleRate * 0.25;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function sfxShot() {
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(4200, t);
  f.frequency.exponentialRampToValueAtTime(320, t + 0.11);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.34, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.15);

  const o = actx.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.08);
  const og = actx.createGain();
  og.gain.setValueAtTime(0.14, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(og); og.connect(master);
  o.start(t); o.stop(t + 0.1);
}
function sfxHit(head) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(head ? 900 : 420, t);
  o.frequency.exponentialRampToValueAtTime(head ? 260 : 120, t + 0.09);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.22, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.12);
}
function sfxHurt() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.22);
}
function sfxLevel() {
  if (!actx) return;
  const t = actx.currentTime;
  [523, 659, 880].forEach((fr, i) => {
    const o = actx.createOscillator(); o.type = 'triangle';
    o.frequency.value = fr;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t + i * 0.07);
    g.gain.exponentialRampToValueAtTime(0.2, t + i * 0.07 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.22);
    o.connect(g); g.connect(master);
    o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.25);
  });
}

  player.magSize    = s.magSize;

  if (gain > 0) player.health = Math.min(player.maxHealth, player.health + gain);

}

/* ---- mouse-control security check ------------------------------------- */
const SEC = {
  required: 1,       // 1 on our own origin: pointer lock rides a single gesture
  window: 900,       // ms allowed between clicks before it resets
  clicks: 0,
  lastClick: 0,
  granted: false,
};
let pointerUnlocked = false;   // flips true once the ritual is passed
let secWatchdog = null;

function buildSecurityCheck() {
  const el = document.createElement('div');
  el.id = 'secCheck';
  el.innerHTML = `
    <div class="ring"></div>
    <div class="core">
      <div class="big" id="secBig">CLICK</div>
      <div class="sm" id="secSm">GRANT MOUSE CONTROL</div>
      <div class="dots" id="secDots"><i></i><i></i><i></i></div>
    </div>`;
  return el;
}

function wireSecurityCheck() {
  const el   = document.getElementById('secCheck');
  const big  = document.getElementById('secBig');
  const sm   = document.getElementById('secSm');
  const dots = document.getElementById('secDots').children;
  const ring = el.querySelector('.ring');

  el.addEventListener('click', () => {
    if (SEC.granted) { startGame(); return; }

    const now = performance.now();
    if (now - SEC.lastClick > SEC.window) SEC.clicks = 0;
    SEC.lastClick = now;
    SEC.clicks++;

    ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');

    for (let i = 0; i < dots.length; i++)
      dots[i].classList.toggle('on', i < SEC.clicks);

    if (SEC.clicks >= SEC.required) {
      SEC.granted = true;
      pointerUnlocked = true;
      el.classList.add('granted');
      big.textContent = 'GRANTED';
      sm.textContent  = 'DEPLOYING';
      if (secWatchdog) { clearInterval(secWatchdog); secWatchdog = null; }
      // call synchronously — pointer lock must ride the original user gesture
      startGame();
    } else {
      big.textContent = `CLICK ${SEC.clicks}/${SEC.required}`;
    }
  });

  // idle reset + shake feedback
  secWatchdog = setInterval(() => {
    if (SEC.granted) return;
    if (SEC.clicks > 0 && performance.now() - SEC.lastClick > SEC.window) {
      SEC.clicks = 0;
      big.textContent = 'CLICK';
      for (const d of dots) d.classList.remove('on');
      el.classList.add('shake');
      setTimeout(() => el.classList.remove('shake'), 340);
    }
  }, 120);
}

  panel.innerHTML = `
    <h1 class="dead" style="font-size:44px">YOU DIED</h1>
    <div class="sub">the horde thanks you for your contribution</div>
    <div class="tally">
      REACHED LEVEL <b>${player.level}</b><br>
      KILLED <b>${player.kills}</b> ZOMBIES<br>
      SURVIVED <b>${wave.n}</b> WAVES
    </div>
    <button id="startBtn">TRY AGAIN</button>`;
  $('startBtn').onclick = startGame;
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  toastT = 1.2;
}

/* =========================================================================
   GAME FLOW
   ========================================================================= */
function startGame() {
  initAudio();
  if (actx && actx.state === 'suspended') actx.resume();

  // reset world
  clearProjectiles();
  for (const z of zombies) scene.remove(z.group);
  zombies.length = 0;
  for (const s of sparks) scene.remove(s.mesh);
  sparks.length = 0;
  for (const t of tracers) { t.line.visible = false; t.life = 0; }

  // reset player
  const s = playerStats(1, { vitality: 0, might: 0, reflex: 0, agility: 0, fortune: 0 });
  Object.assign(player, {
    level: 1, kills: 0, xp: 0,
    skillPoints: 0,
    attributes: { vitality: 0, might: 0, reflex: 0, agility: 0, fortune: 0 },
    maxHealth: s.maxHealth, health: s.maxHealth,
    damage: s.damage, fireDelay: s.fireDelay,
    reloadTime: s.reloadTime, moveSpeed: s.moveSpeed, xpMul: s.xpMul,
    magSize: s.magSize,
    ammo: s.magSize, reloading: false, reloadT: 0, cooldown: 0,
    onGround: true, bob: 0,
    yaw: Math.PI, pitch: 0,
  });
  world.gamestage = 1;
  player.pos.set(0, CFG.player.eyeHeight, 6);
  player.vel.set(0, 0, 0);

  // reset waves
  wave.n = 0; wave.queue = 0; wave.spawnTimer = 0; wave.breather = 1.0;

  vigAmount = 0; hitmarkT = 0; toastT = 0;
  overlay.classList.add('hide');
  hud.classList.add('on');
  state = 'playing';
  renderer.domElement.requestPointerLock();
}

function resumeGame() {
  overlay.classList.add('hide');
  state = 'playing';
  renderer.domElement.requestPointerLock();
}

/* =========================================================================
   INPUT
   ========================================================================= */
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && state === 'playing') tryReload();
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0 && state === 'playing') mouseDown = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
addEventListener('contextmenu', e => e.preventDefault());

/* ---- pointer: raw / coalesced sampling -------------------------------- */
const BASE_SENS = 0.0022;

function applyMouseDelta(dx, dy) {
  if (document.pointerLockElement !== renderer.domElement) return;
  const sens = BASE_SENS * SETTINGS.sensitivity;
  player.yaw   -= dx * sens;
  player.pitch -= dy * sens;
  const lim = Math.PI / 2 - 0.02;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
}

function onPointerMove(e) {
  if (SETTINGS.coalesced && e.getCoalescedEvents) {
    for (const ev of e.getCoalescedEvents()) applyMouseDelta(ev.movementX, ev.movementY);
  } else {
    applyMouseDelta(e.movementX, e.movementY);
  }
}

const HAS_RAW = 'onpointerrawupdate' in window;

function attachPointerInput() {
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerrawupdate', onPointerMove);

  if (SETTINGS.rawInput && HAS_RAW) document.addEventListener('pointerrawupdate', onPointerMove);
  else                                document.addEventListener('pointermove', onPointerMove);
}

document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === renderer.domElement;
  if (!locked && state === 'playing') showPaused();
});

/* =========================================================================
   PLAYER
   ========================================================================= */
const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();
const _wish = new THREE.Vector3();

function updatePlayer(dt) {
  // ---- look ----
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

  // ---- movement basis ----
  _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  _right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  _wish.set(0, 0, 0);
  if (keys.KeyW) _wish.add(_fwd);
  if (keys.KeyS) _wish.sub(_fwd);
  if (keys.KeyD) _wish.add(_right);
  if (keys.KeyA) _wish.sub(_right);
  const moving = _wish.lengthSq() > 0;
  if (moving) _wish.normalize();

  const sprinting = keys.ShiftLeft || keys.ShiftRight;
  const speed = player.moveSpeed * (sprinting && keys.KeyW ? CFG.player.sprintMul : 1);

  const accel = player.onGround ? 16 : 5;
  const k = Math.min(1, accel * dt);
  player.vel.x += (_wish.x * speed - player.vel.x) * k;
  player.vel.z += (_wish.z * speed - player.vel.z) * k;

  // ---- jump / gravity ----
  if (keys.Space && player.onGround) {
    player.vel.y = CFG.player.jumpVel;
    player.onGround = false;
  }
  player.vel.y -= CFG.player.gravity * dt;

  // ---- integrate ----
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  player.pos.y += player.vel.y * dt;

  resolveCollisions(player.pos, CFG.player.radius);

  if (player.pos.y <= CFG.player.eyeHeight) {
    player.pos.y = CFG.player.eyeHeight;
    player.vel.y = 0;
    player.onGround = true;
  }

  // ---- head bob ----
  const hspeed = Math.hypot(player.vel.x, player.vel.z);
  player.bob += dt * hspeed * 1.5;
  const bobY = Math.sin(player.bob * 2) * 0.035 * Math.min(1, hspeed / 5);
  const bobX = Math.cos(player.bob) * 0.02 * Math.min(1, hspeed / 5);

  camera.position.set(player.pos.x + bobX * _right.x, player.pos.y + bobY, player.pos.z + bobX * _right.z);

  // ---- shooting ----
  player.cooldown -= dt;
  if (player.reloading) {
    player.reloadT -= dt;
    if (player.reloadT <= 0) {
      player.reloading = false;
      player.ammo = player.magSize;
    }
  } else if (mouseDown && player.cooldown <= 0) {
    if (player.ammo > 0) fire();
    else tryReload();
  }

  // ---- gun recoil recovery ----
  const restX = 0.20, restY = -0.19, restZ = -0.42;
  gunRig.position.x += (restX - gunRig.position.x) * Math.min(1, 14 * dt);
  gunRig.position.y += (restY - gunRig.position.y) * Math.min(1, 14 * dt);
  gunRig.position.z += (restZ - gunRig.position.z) * Math.min(1, 14 * dt);
  gunRig.rotation.x += (0 - gunRig.rotation.x) * Math.min(1, 12 * dt);

  // muzzle flash decay
  muzzleFlash.material.opacity *= Math.pow(0.0001, dt);
  muzzleLight.intensity *= Math.pow(0.0001, dt);
}

function tryReload() {
  if (player.reloading || player.ammo >= player.magSize) return;
  player.reloading = true;
  player.reloadT = player.reloadTime;
  reloadTxt.classList.add('on');
  gunRig.rotation.x = 0.5;
}

function fire() {
  player.cooldown = player.fireDelay;
  player.ammo--;

  // recoil + flash
  gunRig.position.z += 0.07;
  gunRig.position.y += 0.012;
  gunRig.rotation.x -= 0.09;
  muzzleFlash.material.opacity = 1;
  muzzleFlash.rotation.z = Math.random() * Math.PI;
  muzzleLight.position.copy(camera.position);
  muzzleLight.intensity = 26;
  sfxShot();

  // hitscan from screen center
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  raycaster.far = 200;

  const targets = [];
  for (const z of zombies) targets.push(z.group);
  for (const c of scene.children) {
    if (c.isMesh && c !== ground && !c.isGridHelper) targets.push(c);
  }

  const hits = raycaster.intersectObjects(targets, true);
  const origin = new THREE.Vector3().copy(camera.position);
  origin.addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 0.55);
  origin.y -= 0.12;

  let endPoint = null;
  let hitZombie = null;
  let wasHead = false;

  for (const h of hits) {
    const z = findZombie(h.object);
    if (z && z.dead) continue;
    endPoint = h.point;
    hitZombie = z;
    wasHead = !!h.object.userData.head;
    break;
  }

  if (!endPoint) {
    endPoint = new THREE.Vector3();
    raycaster.ray.at(120, endPoint);
  }

  spawnTracer(origin, endPoint);

  if (hitZombie) {
    const dmg = player.damage * (wasHead ? 2.4 : 1);
    damageZombie(hitZombie, dmg, raycaster.ray.direction, wasHead);
    spawnSparks(endPoint, 0x9e1f1f, 7);
    sfxHit(wasHead);
    hitmarkT = 0.14;
    hitmark.style.color = wasHead ? '#ff4d4d' : '#ffffff';
    hitmark.style.opacity = '1';
  } else {
    spawnSparks(endPoint, 0xbfc8b0, 5);
  }
}

function findZombie(obj) {
  let o = obj;
  while (o) {
    if (o.userData.zombie) return o.userData.zombie;
    o = o.parent;
  }
  return null;
}

/* =========================================================================
   ZOMBIES
   ========================================================================= */
function createZombie(level, typeKey, pos) {
  const type = MOB_TYPES[typeKey] || MOB_TYPES.walker;
  const stats = zombieStats(level, typeKey);
  const t = Math.min(1, (level - 1) / 14);

  const baseCol = new THREE.Color(type.color);
  const levelCol = Z_COL_LO.clone().lerp(Z_COL_HI, t);
  const col = baseCol.clone().lerp(levelCol, t * 0.32);

  const mat = new THREE.MeshStandardMaterial({
    color: col, roughness: 0.96, metalness: 0.0,
    emissive: 0xffffff, emissiveIntensity: 0,
  });
  const eyeMat = new THREE.MeshBasicMaterial({ color: type.ranged ? 0xc79aff : 0xff2a15 });

  const group = new THREE.Group();

  const legL = new THREE.Mesh(GEO.leg, mat); legL.position.set(-0.17, 0.9, 0);
  const legR = new THREE.Mesh(GEO.leg, mat); legR.position.set( 0.17, 0.9, 0);
  const torso = new THREE.Mesh(GEO.torso, mat); torso.position.set(0, 1.35, 0);
  torso.castShadow = true;
  const head = new THREE.Mesh(GEO.head, mat); head.position.set(0, 2.0, 0);
  head.userData.head = true;
  head.castShadow = true;

  const eyeL = new THREE.Mesh(GEO.eye, eyeMat); eyeL.position.set(-0.10, 0.045, 0.215);
  const eyeR = new THREE.Mesh(GEO.eye, eyeMat); eyeR.position.set( 0.10, 0.045, 0.215);
  head.add(eyeL, eyeR);

  const armL = new THREE.Mesh(GEO.arm, mat); armL.position.set(-0.47, 1.70, 0.05); armL.rotation.x = -1.35;
  const armR = new THREE.Mesh(GEO.arm, mat); armR.position.set( 0.47, 1.70, 0.05); armR.rotation.x = -1.35;

  group.add(legL, legR, torso, head, armL, armR);
  group.position.copy(pos);
  group.scale.setScalar(type.scale);

  scene.add(group);

  const z = {
    group, mat, type, typeKey, stats,
    level,
    health: stats.maxHealth,
    maxHealth: stats.maxHealth,
    speed: stats.speed * (1 + (Math.random() * 2 - 1) * CFG.zombie.speedJitter * 0.5),
    damage: stats.damage,
    reach: stats.reach,
    cooldown: stats.cooldown,
    radius: CFG.zombie.radius * type.scale,
    attackCd: 0,
    fireCd: type.ranged ? type.fireInterval * (0.6 + Math.random()) : 0,
    walkPhase: Math.random() * Math.PI * 2,
    flash: 0,
    dead: false,
    knock: new THREE.Vector3(),
    parts: { legL, legR, armL, armR, head, torso },
    lastDist: 999, stuckTimer: 0, strafeDir: 0, strafeTimer: 0,
  };
  group.userData.zombie = z;
  zombies.push(z);
  return z;
}

function damageZombie(z, amount, dir, head) {
  if (z.dead) return;
  z.health -= amount;
  z.flash = 1;
  z.knock.set(dir.x, 0, dir.z).normalize().multiplyScalar(head ? 3.5 : 6);

  if (z.health <= 0) {
    z.dead = true;
    scene.remove(z.group);
    const i = zombies.indexOf(z);
    if (i >= 0) zombies.splice(i, 1);
    // cleanup per-zombie material
    z.mat.dispose();

    player.kills++;
    player.xp += 1 * player.xpMul;
    while (player.xp >= CFG.player.killsPerLevel) {
      player.xp -= CFG.player.killsPerLevel;
      levelUp();
    }
  }
}

function levelUp() {
  player.level++;
  player.skillPoints += CFG.player.skillPointsPerLevel;
  recomputePlayerStats();
  player.health = player.maxHealth;
  toast('LEVEL ' + player.level);
  sfxLevel();
}

function updateZombies(dt) {
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    const p = z.group.position;

    // ---- knockback decay ----
    if (z.knock.lengthSq() > 0.0001) {
      p.x += z.knock.x * dt;
      p.z += z.knock.z * dt;
      z.knock.multiplyScalar(Math.max(0, 1 - 9 * dt));
    }

    // ---- vector to player ----
    let dx = player.pos.x - p.x;
    let dz = player.pos.z - p.z;
    const dist = Math.hypot(dx, dz) || 0.0001;
    const nx = dx / dist, nz = dz / dist;

    // ---- face the player ----
    const targetYaw = Math.atan2(dx, dz);
    let dy = targetYaw - z.group.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    z.group.rotation.y += dy * Math.min(1, 7 * dt);

    // ---- anti-stuck strafe ----
    z.stuckTimer += dt;
    if (z.stuckTimer > 0.7) {
      if (z.lastDist - dist < 0.25 && dist > z.reach + 0.5) {
        z.strafeDir = Math.random() < 0.5 ? -1 : 1;
        z.strafeTimer = 0.9;
      }
      z.lastDist = dist;
      z.stuckTimer = 0;
    }
    let sx = 0, sz = 0;
    if (z.strafeTimer > 0) {
      z.strafeTimer -= dt;
      sx = -nz * z.strafeDir;
      sz =  nx * z.strafeDir;
    }

    // ---- separation from other zombies ----
    let sepx = 0, sepz = 0;
    for (let j = 0; j < zombies.length; j++) {
      if (j === i) continue;
      const o = zombies[j];
      const ox = p.x - o.group.position.x;
      const oz = p.z - o.group.position.z;
      const d2 = ox * ox + oz * oz;
      const minD = z.radius + o.radius + 0.25;
      if (d2 < minD * minD && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const push = (minD - d) / minD;
        sepx += (ox / d) * push * 1.6;
        sepz += (oz / d) * push * 1.6;
      }
    }

    // ---- movement / standoff ----
    let advance = true;
    if (z.type.ranged) {
      const pref = z.type.preferredRange;
      if (dist < pref - 2.5)      advance = false;  // back off
      else if (dist > pref + 2.5) advance = true;   // close in
      else                        advance = false;  // hold
    }

    if (advance && dist > z.reach) {
      const mvx = nx + sepx + sx;
      const mvz = nz + sepz + sz;
      const m = Math.hypot(mvx, mvz) || 1;
      p.x += (mvx / m) * z.speed * dt;
      p.z += (mvz / m) * z.speed * dt;
      resolveCollisions(p, z.radius);
      z.walkPhase += dt * z.speed * 3.2;
    } else if (z.type.ranged && dist < z.type.preferredRange - 2.5) {
      p.x -= nx * z.speed * 0.85 * dt;
      p.z -= nz * z.speed * 0.85 * dt;
      resolveCollisions(p, z.radius);
      z.walkPhase += dt * z.speed * 2.4;
    } else {
      if (sx || sz) {
        p.x += sx * z.speed * 0.6 * dt;
        p.z += sz * z.speed * 0.6 * dt;
        resolveCollisions(p, z.radius);
      }
      z.walkPhase += dt * 1.4;
    }

    // ---- melee attack ----
    z.attackCd -= dt;
    if (!z.type.ranged && dist <= z.reach + z.radius && z.attackCd <= 0) {
      z.attackCd = z.cooldown;
      damagePlayer(z.damage);
      z.parts.armL.rotation.x = -1.9;
      z.parts.armR.rotation.x = -1.9;
    }

    // ---- ranged attack ----
    if (z.type.ranged) {
      z.fireCd -= dt;
      if (z.fireCd <= 0 && dist < z.type.preferredRange + 5 && dist > 2.5) {
        z.fireCd = z.type.fireInterval * (0.85 + Math.random() * 0.4);
        const muzzle = new THREE.Vector3(p.x, p.y + 1.55 * z.type.scale, p.z);
        const target = new THREE.Vector3(player.pos.x, player.pos.y - 0.15, player.pos.z);
        spawnProjectile(muzzle, target, z.damage, z.type.projectileSpeed);
        z.parts.armL.rotation.x = -1.95;
        z.parts.armR.rotation.x = -1.95;
      }
    }

    // ---- animation ----
    const sw = Math.sin(z.walkPhase);
    z.parts.legL.rotation.x =  sw * 0.65;
    z.parts.legR.rotation.x = -sw * 0.65;
    const armBase = -1.35;
    z.parts.armL.rotation.x += ((armBase + Math.sin(z.walkPhase + 0.6) * 0.18) - z.parts.armL.rotation.x) * Math.min(1, 6 * dt);
    z.parts.armR.rotation.x += ((armBase - Math.sin(z.walkPhase + 0.6) * 0.18) - z.parts.armR.rotation.x) * Math.min(1, 6 * dt);
    z.parts.head.rotation.z = Math.sin(z.walkPhase * 0.5) * 0.09;
    z.group.position.y = Math.abs(Math.sin(z.walkPhase)) * 0.05;

    // ---- hit flash ----
    if (z.flash > 0) {
      z.flash = Math.max(0, z.flash - dt * 6);
      z.mat.emissiveIntensity = z.flash * 1.4;
    }
  }
}

/* =========================================================================
   WAVES
   ========================================================================= */
function spawnPoint() {
  const px = player.pos.x, pz = player.pos.z;
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * 16;
    const x = px + Math.cos(a) * r;
    const z = pz + Math.sin(a) * r;
    if (Math.abs(x) > A - 2.5 || Math.abs(z) > A - 2.5) continue;
    if (insideCollider(x, z, 1.4)) continue;
    return new THREE.Vector3(x, 0, z);
  }
  // fallback: random arena point far from player
  for (let i = 0; i < 60; i++) {
    const x = (Math.random() - 0.5) * (A * 2 - 8);
    const z = (Math.random() - 0.5) * (A * 2 - 8);
    if (Math.hypot(x - px, z - pz) < 14) continue;
    if (insideCollider(x, z, 1.4)) continue;
    return new THREE.Vector3(x, 0, z);
  }
  return new THREE.Vector3(-A + 6, 0, -A + 6);
}

function updateWave(dt) {
  if (wave.queue > 0) {
    wave.spawnTimer -= dt;
    if (wave.spawnTimer <= 0) {
      const gs = rollGamestage(player.level);
      const typeKey = pickMobType(gs);
      createZombie(gs, typeKey, spawnPoint());
      wave.queue--;
      wave.spawnTimer = CFG.wave.spawnInterval;
    }
  } else if (zombies.length === 0) {
    if (wave.n > 0) {
      wave.breather -= dt;
      if (wave.breather <= 0) { wave.breather = CFG.wave.breather; startWave(); }
    } else {
      wave.breather -= dt;
      if (wave.breather <= 0) startWave();
    }
  }
}

function startWave() {
  wave.n++;
  wave.queue = CFG.wave.baseCount + CFG.wave.growth * (wave.n - 1);
  wave.spawnTimer = 0;
  toast('WAVE ' + wave.n);
}

/* =========================================================================
   PLAYER DAMAGE
   ========================================================================= */
function damagePlayer(amount) {
  if (state !== 'playing') return;
  player.health -= amount;
  vigAmount = 1;
  sfxHurt();

  if (player.health <= 0) {
    player.health = 0;
    showDead();
  }
}

/* =========================================================================
   EFFECTS
   ========================================================================= */
const sparkGeo = new THREE.BoxGeometry(0.06, 0.06, 0.06);
function spawnSparks(pos, color, count) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < count; i++) {
    if (sparks.length > 90) break;
    const mesh = new THREE.Mesh(sparkGeo, mat.clone());
    mesh.position.copy(pos);
    mesh.scale.setScalar(0.6 + Math.random() * 0.9);
    scene.add(mesh);
    sparks.push({
      mesh,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 5,
        Math.random() * 3.5 + 0.5,
        (Math.random() - 0.5) * 5
      ),
      life: 0.45 + Math.random() * 0.35,
      maxLife: 0.8,
    });
  }
}

function spawnTracer(from, to) {
  let t = tracers.find(t => t.life <= 0);
  if (!t) {
    if (tracers.length > 24) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: 0xffe9a8, transparent: true, opacity: 1,
    }));
    line.frustumCulled = false;
    line.visible = false;
    scene.add(line);
    t = { line, life: 0 };
    tracers.push(t);
  }
  const arr = t.line.geometry.attributes.position.array;
  arr[0] = from.x; arr[1] = from.y; arr[2] = from.z;
  arr[3] = to.x;   arr[4] = to.y;   arr[5] = to.z;
  t.line.geometry.attributes.position.needsUpdate = true;
  t.line.geometry.computeBoundingSphere();
  t.line.visible = true;
  t.line.material.opacity = 1;
  t.life = 0.055;
}

/* =========================================================================
   PROJECTILES — spitter shots
   ========================================================================= */
const projectiles = [];
const projGeo = new THREE.SphereGeometry(0.16, 8, 8);
const projMat = new THREE.MeshBasicMaterial({
  color: 0xc79aff, transparent: true, opacity: 0.95,
});

function spawnProjectile(from, to, damage, speed) {
  const dir = new THREE.Vector3().subVectors(to, from).normalize();
  const mesh = new THREE.Mesh(projGeo, projMat);
  mesh.position.copy(from);
  scene.add(mesh);
  projectiles.push({ mesh, dir, damage, speed, life: 4.0 });
}

function clearProjectiles() {
  for (const p of projectiles) scene.remove(p.mesh);
  projectiles.length = 0;
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.dir, p.speed * dt);
    p.mesh.position.y += Math.sin(p.life * 18) * 0.004;

    const dx = p.mesh.position.x - player.pos.x;
    const dy = p.mesh.position.y - (player.pos.y - 0.30);
    const dz = p.mesh.position.z - player.pos.z;
    if (dx * dx + dy * dy + dz * dz < 0.55 * 0.55) {
      damagePlayer(p.damage);
      spawnSparks(p.mesh.position, 0xc79aff, 8);
      scene.remove(p.mesh); projectiles.splice(i, 1);
      continue;
    }
    if (p.mesh.position.y < 0.05) {
      spawnSparks(p.mesh.position, 0x9a7ac8, 6);
      scene.remove(p.mesh); projectiles.splice(i, 1);
      continue;
    }
    if (p.life <= 0) {
      scene.remove(p.mesh); projectiles.splice(i, 1);
    }
  }
}

function updateEffects(dt) {
  // sparks
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt;
    if (s.life <= 0) {
      scene.remove(s.mesh);
      s.mesh.material.dispose();
      sparks.splice(i, 1);
      continue;
    }
    s.vel.y -= 18 * dt;
    s.mesh.position.addScaledVector(s.vel, dt);
    if (s.mesh.position.y < 0.03) { s.mesh.position.y = 0.03; s.vel.y *= -0.35; s.vel.multiplyScalar(0.7); }
    s.mesh.material.opacity = Math.min(1, s.life / 0.3);
  }

  // tracers
  for (const t of tracers) {
    if (t.life > 0) {
      t.life -= dt;
      t.line.material.opacity = Math.max(0, t.life / 0.055);
      if (t.life <= 0) t.line.visible = false;
    }
  }

  // vignette
  if (vigAmount > 0) {
    vigAmount = Math.max(0, vigAmount - dt * 2.2);
    vig.style.opacity = vigAmount * 0.85;
  }
  lowhp.style.opacity = player.health / player.maxHealth < 0.3 ? 1 : 0;

  // hitmarker
  if (hitmarkT > 0) {
    hitmarkT -= dt;
    if (hitmarkT <= 0) hitmark.style.opacity = '0';
  }

  // toast
  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) toastEl.classList.remove('on');
  }
}

/* =========================================================================
   HUD
   ========================================================================= */
function updateHUD() {
  // world gamestage = highest-level zombie currently alive
  let mx = 0;
  for (const z of zombies) if (z.level > mx) mx = z.level;
  world.gamestage = mx;

  uiLevel.textContent = player.level;
  uiStage.textContent = world.gamestage || '—';
  uiKills.textContent = player.kills;
  uiWave.textContent = Math.max(1, wave.n);
  uiAlive.textContent = zombies.length;

  const hp = Math.max(0, player.health);
  hpFill.style.transform = `scaleX(${Math.max(0, hp / player.maxHealth)})`;
  hpNum.textContent = Math.ceil(hp);

  const xpFrac = player.xp / CFG.player.killsPerLevel;
  xpFill.style.transform = `scaleX(${xpFrac})`;
  xpNum.textContent = `${Math.floor(player.xp)}/${CFG.player.killsPerLevel}`;

  uMag.textContent = player.ammo;
  uRes.textContent = '/ ' + player.magSize;
  reloadTxt.classList.toggle('on', player.reloading);

  const sh = document.getElementById('skillHint');
  uSkillPts.textContent = player.skillPoints;
  sh.classList.toggle('on', player.skillPoints > 0);
}

/* =========================================================================
   SETTINGS PANEL
   ========================================================================= */
const RANGE_FMT = {
  sensitivity: v => v.toFixed(2) + '×',
  renderScale: v => v.toFixed(2) + '×',
  fov:         v => Math.round(v) + '°',
  exposure:    v => v.toFixed(2),
};

function buildSettingsPanel() {
  const seg = (label, hint, key, opts) => `
    <div class="sRow">
      <div class="sLabel">${label}${hint ? `<span class="hint">${hint}</span>` : ''}</div>
      <div class="sSeg" data-key="${key}">
        ${opts.map(o => `<button data-val="${o.v}" class="${SETTINGS[key] === o.v ? 'on' : ''}">${o.l}</button>`).join('')}
      </div>
    </div>`;
  const toggle = (label, hint, key, reload) => `
    <div class="sRow">
      <div class="sLabel">${label}${reload ? '<span class="sBadge">RELOAD</span>' : ''}${hint ? `<span class="hint">${hint}</span>` : ''}</div>
      <div class="sToggle ${SETTINGS[key] ? 'on' : ''}" data-key="${key}"></div>
    </div>`;
  const range = (label, hint, key, min, max, step) => `
    <div class="sRow">
      <div class="sLabel">${label}${hint ? `<span class="hint">${hint}</span>` : ''}</div>
      <input type="range" class="sRange" data-key="${key}"
             min="${min}" max="${max}" step="${step}" value="${SETTINGS[key]}">
      <span class="sVal" data-val-for="${key}">${RANGE_FMT[key](SETTINGS[key])}</span>
    </div>`;

  return `
    <div class="sHead"><span>VIDEO / INPUT</span><button class="sClose" id="sClose">✕</button></div>
    <div class="sBody">

      <div class="sGroup">
        <div class="sGroupTitle">FRAME PACING</div>
        ${seg('Frame loop', 'uncapped needs the desync canvas below to actually help', 'frameMode', [
          { v: 'vsync',    l: 'VSYNC' },
          { v: 'uncapped', l: 'UNCAPPED' },
        ])}
        ${seg('FPS cap', 'ceiling for uncapped mode — lower it if the game hitches', 'maxFps', [
          { v: '0',   l: 'OFF' },
          { v: '240', l: '240' },
          { v: '144', l: '144' },
          { v: '120', l: '120' },
          { v: '60',  l: '60' },
        ])}
        ${toggle('Desynchronized canvas', 'skips the compositor queue — the real latency win', 'desync', true)}
      </div>

      <div class="sGroup">
        <div class="sGroupTitle">POINTER INPUT</div>
        ${toggle('Raw pointer updates', 'every hardware sample, no browser coalescing', 'rawInput')}
        ${toggle('Drain coalesced events', 'replays buffered samples on the fallback path', 'coalesced')}
        ${range('Mouse sensitivity', null, 'sensitivity', 0.2, 3, 0.05)}
      </div>

      <div class="sGroup">
        <div class="sGroupTitle">RENDER</div>
        ${range('Render scale', 'below 1.0 renders fewer pixels — direct latency win', 'renderScale', 0.5, 1.5, 0.05)}
        ${seg('Shadows', null, 'shadows', [
          { v: 'off',  l: 'OFF' },
          { v: 'low',  l: 'LOW' },
          { v: 'high', l: 'HIGH' },
        ])}
        ${toggle('Anti-aliasing', 'MSAA costs roughly one frame of latency', 'antialias', true)}
      </div>

      <div class="sGroup">
        <div class="sGroupTitle">IMAGE</div>
        ${range('Field of view', null, 'fov', 60, 110, 1)}
        ${range('Exposure', null, 'exposure', 0.6, 2.4, 0.05)}
      </div>

    </div>
    <div class="sFoot">
      <span>SETTINGS SAVE AUTOMATICALLY</span>
      <button id="sReset">RESET DEFAULTS</button>
    </div>`;
}

const gearBtn      = document.getElementById('gearBtn');
const settingsRoot = document.getElementById('settings');
const sPanel       = document.getElementById('sPanel');

function onSettingChanged(key) {
  switch (key) {
    case 'rawInput':
    case 'coalesced':   attachPointerInput(); break;
    case 'renderScale': applyVideoSettings(); break;
    case 'shadows':     applyShadowSettings(); forceMaterialRecompile(); break;
    case 'fov':         camera.fov = SETTINGS.fov; camera.updateProjectionMatrix(); break;
    case 'exposure':    renderer.toneMappingExposure = SETTINGS.exposure; break;
    // frameMode, sensitivity, desync, antialias need no action here
  }
}

function wireSettingsControls() {
  document.getElementById('sClose').onclick = closeSettings;
  document.getElementById('sReset').onclick = () => {
    resetSettings();
    applyVideoSettings();
    attachPointerInput();
    forceMaterialRecompile();
    sPanel.innerHTML = buildSettingsPanel();
    wireSettingsControls();
  };

  sPanel.querySelectorAll('.sSeg').forEach(el => {
    el.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        SETTINGS[el.dataset.key] = btn.dataset.val;
        saveSettings();
        el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
        onSettingChanged(el.dataset.key);
      };
    });
  });

  sPanel.querySelectorAll('.sToggle').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.key;
      SETTINGS[k] = !SETTINGS[k];
      saveSettings();
      el.classList.toggle('on', SETTINGS[k]);
      onSettingChanged(k);
    };
  });

  sPanel.querySelectorAll('.sRange').forEach(el => {
    el.oninput = () => {
      const k = el.dataset.key;
      SETTINGS[k] = parseFloat(el.value);
      const out = sPanel.querySelector(`[data-val-for="${k}"]`);
      if (out) out.textContent = RANGE_FMT[k](SETTINGS[k]);
      saveSettings();
      onSettingChanged(k);
    };
  });
}

function openSettings() {
  if (state === 'playing') document.exitPointerLock?.();
  sPanel.innerHTML = buildSettingsPanel();
  wireSettingsControls();
  settingsRoot.classList.add('on');
}
function closeSettings() {
  settingsRoot.classList.remove('on');
}

gearBtn.onclick = openSettings;

addEventListener('keydown', e => {
  if (e.code === 'Escape' && settingsRoot.classList.contains('on')) closeSettings();
});

/* =========================================================================
   FRAME SCHEDULING — vsync / uncapped with backpressure guard
   ========================================================================= */
let frameQueued = false;
let lastTickTime = performance.now();

// rolling perf counters (ms)
const perf = {
  update:   0,
  render:   0,
  samples:  0,
};
const PERF_SMOOTH = 0.08;

// display-sync heartbeat — rAF fires at display rate regardless of what our
// render loop is doing, so its interval is a proxy for compositor health.
const display = { interval: 16.7, last: 0, samples: 0 };
function displayHeartbeat(t) {
  if (display.last > 0) {
    const d = t - display.last;
    if (d < 100) {                          // ignore tab-throttled jumps
      display.interval += (d - display.interval) * 0.1;
      display.samples++;
    }
  }
  display.last = t;
  requestAnimationFrame(displayHeartbeat);
}
requestAnimationFrame(displayHeartbeat);

function runFrame(now) {
  const dt = Math.min(0.05, (now - lastTickTime) / 1000);
  lastTickTime = now;

  const t0 = performance.now();
  if (state === 'playing') {
    updatePlayer(dt);
    updateZombies(dt);
    updateWave(dt);
    updateProjectiles(dt);
    updateEffects(dt);
    updateHUD();
  } else {
    updateEffects(dt);
  }
  const t1 = performance.now();

  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  if (state === 'playing' || state === 'paused') renderer.render(gunScene, gunCam);
  const t2 = performance.now();

  perf.update += ((t1 - t0) - perf.update) * PERF_SMOOTH;
  perf.render += ((t2 - t1) - perf.render) * PERF_SMOOTH;
  perf.samples++;

  scheduleFrame();
}

function scheduleFrame() {
  if (frameQueued) return;
  frameQueued = true;

  const mode = SETTINGS.frameMode;
  const cap  = SETTINGS.maxFps | 0;

  // uncapped is only meaningful with a desynchronized canvas — without it
  // the compositor still paces presentation and piling on extra frames
  // just deepens the swap-chain queue. That was the original stall.
  const canUncap = mode === 'uncapped' && SETTINGS.desync;

  // backpressure guard: if rAF is firing noticeably slower than display rate,
  // the compositor is backlogged. Yield a cycle of vsync to drain it.
  const starved =
    display.samples > 60 &&
    display.interval > 22;

  if (canUncap && !starved) {
    // default to a ~250 Hz ceiling when no cap is set — this is the sweet
    // spot that gets latency gains without pinning a core or flooding the
    // driver's command queue
    const targetInterval = cap > 0 ? 1000 / cap : 4;
    const busy = perf.update + perf.render;
    const wait = Math.max(0, targetInterval - busy);

    // setTimeout (not MessageChannel) so input events get a turn in the
    // macrotask queue between frames. MessageChannel hogged it entirely.
    setTimeout(() => {
      frameQueued = false;
      runFrame(performance.now());
    }, wait);
    return;
  }

  // vsync / fallback
  requestAnimationFrame(t => {
    frameQueued = false;
    runFrame(t);
  });
}

/* =========================================================================
   SKILL PANEL
   ========================================================================= */
const skillPanel = document.getElementById('skillPanel');
const spBody     = document.getElementById('spBody');
const spPts      = document.getElementById('spPts');

function renderSkillPanel() {
  spPts.textContent = player.skillPoints;
  spBody.innerHTML = Object.entries(ATTRIBUTES).map(([key, a]) => {
    const lv   = player.attributes[key] | 0;
    const cost = attributeCost(key);
    const can  = player.skillPoints >= cost;
    return `
      <div class="spRow">
        <div class="spIcon">${a.icon}</div>
        <div class="spInfo">
          <div class="spName">${a.label}<span class="lv">LV ${lv}</span></div>
          <div class="spDesc">${a.desc}</div>
        </div>
        <button class="spAdd" data-attr="${key}" ${can ? '' : 'disabled'}>
          ${cost > 1 ? `<span class="cost">${cost}</span>` : ''}+
        </button>
      </div>`;
  }).join('');

  spBody.querySelectorAll('.spAdd').forEach(btn => {
    btn.onclick = () => {
      const key  = btn.dataset.attr;
      const cost = attributeCost(key);
      if (player.skillPoints < cost) return;
      player.skillPoints -= cost;
      player.attributes[key]++;
      recomputePlayerStats();
      renderSkillPanel();
      sfxLevel();
    };
  });
}

function openSkills() {
  if (state !== 'playing') return;
  state = 'paused';
  if (document.pointerLockElement) document.exitPointerLock?.();
  renderSkillPanel();
  skillPanel.classList.add('on');
}
function closeSkills() {
  if (state !== 'paused') return;
  skillPanel.classList.remove('on');
  state = 'playing';
  renderer.domElement.requestPointerLock();
}

document.getElementById('spClose').onclick = closeSkills;

addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Tab') {
    e.preventDefault();
    if (skillPanel.classList.contains('on')) closeSkills();
    else if (state === 'playing') openSkills();
  }
});

/* =========================================================================
   BOOT
   ========================================================================= */
applyVideoSettings();
recomputePlayerStats();
attachPointerInput();
camera.position.copy(player.pos);
camera.rotation.set(0, Math.PI, 0, 'YXZ');
showMenu();
scheduleFrame();
</script>
</body>
